name: Bundle Raycast Extension

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Bundle .rayext
        run: npm run bundle

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raycast-litellm-bundle
          path: release/raycast-litellm.rayext

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/raycast-litellm.rayext
